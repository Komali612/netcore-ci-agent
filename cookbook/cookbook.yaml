# netcore-ci-agent cookbook — .NET Core (6/7/8) CI recipes ONLY.
#
# Per the platform model (see ARCHITECTURE.md §2.3), every agent carries its OWN
# cookbook, scoped to only the framework that agent owns. This agent owns .NET
# Core, so this file holds the .NET Core recipe and nothing else.
#
# The recipe below is seeded from the authoritative interim cookbook in
# `cicd-bootstrap` (src/cicd_bootstrap/cookbooks/cookbooks.yaml, the `dotnet`
# entry + its `dotnet` sonar strategy). A recipe declares only the parts that
# differ per stack; the shared workflow skeleton (name/on/permissions, checkout,
# the Sonar guard, the image-push phase) is the generator's job.
#
# Commands may reference the repo layout via placeholders, resolved by the
# generator from DISCOVER's results (never assume a root-level project):
#   __TARGET__       the build target — the .sln when there is one, else each
#                    discovered .csproj (the line is repeated per target)
#   __TEST_TARGET__  same, but only test projects

sonar_strategies:
  # The .NET scanner is a global tool that wraps a build and runs on a JVM.
  dotnet:
    - name: "Sonar: set up JDK"
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
    - name: "Sonar: install scanner"
      run: dotnet tool install --global dotnet-sonarscanner
    # __SONAR_PROJECT_KEY__ / __SONAR_ORG__ are resolved by the generator from the
    # repo + configured org (see cookbook.resolve_sonar_steps); the host URL comes
    # from the SONAR_HOST_URL secret, defaulting to SonarCloud when unset.
    - name: Sonar scan begin
      run: >-
        dotnet-sonarscanner begin /k:"__SONAR_PROJECT_KEY__" /o:"__SONAR_ORG__"
        /d:sonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}" /d:sonar.token="$SONAR_TOKEN"
        /d:sonar.qualitygate.wait=false
        /d:sonar.exclusions="**/.github/**,**/Program.cs"
        /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
    - name: Sonar build
      run: dotnet build "__TARGET__" --configuration Release
    - name: Sonar scan end
      run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

cookbooks:
  dotnet:
    language: csharp
    display_name: .NET (C#)
    setup:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
    build:
      - dotnet restore "__TARGET__"
      - dotnet build "__TARGET__" --configuration Release --no-restore
    # Collect coverage in OpenCover format (coverlet.collector, via a runsettings)
    # so the Sonar .NET scanner can read it from sonar.cs.opencover.reportsPaths.
    test: |
      cat > coverlet.runsettings <<'EOF'
      <RunSettings><DataCollectionRunSettings><DataCollectors><DataCollector friendlyName="XPlat Code Coverage"><Configuration><Format>opencover</Format></Configuration></DataCollector></DataCollectors></DataCollectionRunSettings></RunSettings>
      EOF
      dotnet test "__TEST_TARGET__" --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults
    sonar: dotnet
    # Optional, capability-gated CI steps. The whole pipeline is generated as ONE
    # job with a single checkout; each block below is included only when its tool
    # is selected in the orchestrator UI, and commented out (leading #) when the
    # capability is left "— not used —". __TOOL__ is replaced with the selected
    # tool's name. Edit these to change what each CI tool step does.
    tool_steps:
      sast:
        - name: "Run SAST (__TOOL__)"
          run: echo "SAST analysis via __TOOL__ (placeholder)"
      sca:
        - name: "Run SCA (__TOOL__)"
          run: echo "SCA analysis via __TOOL__ (placeholder)"
      dast:
        - name: "Run DAST (__TOOL__)"
          run: echo "DAST analysis via __TOOL__ (placeholder)"
      imgscan:
        - name: "Scan container image (__TOOL__)"
          run: echo "Container image scan via __TOOL__ (placeholder)"
      artifact:
        - name: "Publish artifacts (__TOOL__)"
          run: echo "Publish build artifacts to __TOOL__ (placeholder)"
      registry:
        - name: "Log in to registry (__TOOL__)"
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: '${{ github.actor }}'
            password: '${{ secrets.GITHUB_TOKEN }}'
        - name: Build and push image
          run: |
            REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            IMAGE=ghcr.io/$REPO:${{ github.sha }}
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
        - name: Generate SBOM
          run: echo "SBOM generation (placeholder - e.g. Trivy/Syft)"
      monitoring:
        - name: "Send telemetry (__TOOL__)"
          run: echo "Send build metrics/logs to __TOOL__ (placeholder)"
    dockerfile: |
      FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
      WORKDIR /src
      COPY . .
      RUN dotnet publish -c Release -o /app

      FROM mcr.microsoft.com/dotnet/aspnet:8.0
      WORKDIR /app
      COPY --from=build /app .
      EXPOSE 8080
      # TODO: set to your published entrypoint dll, e.g. MyApp.dll
      ENTRYPOINT ["dotnet", "app.dll"]

# netcore-ci-agent cookbook — .NET Core (6/7/8) CI recipes ONLY.
#
# Per the platform model (see ARCHITECTURE.md §2.3), every agent carries its OWN
# cookbook, scoped to only the framework that agent owns. This agent owns .NET
# Core, so this file holds the .NET Core recipe and nothing else.
#
# The recipe below is seeded verbatim from the authoritative interim cookbook in
# `cicd-bootstrap` (src/cicd_bootstrap/cookbooks/cookbooks.yaml, the `dotnet`
# entry + its `dotnet` sonar strategy). A recipe declares only the parts that
# differ per stack; the shared workflow skeleton (name/on/permissions, checkout,
# the Sonar guard, the image-push phase) is the generator's job.
#
# BACKLOG (known drift, see ARCHITECTURE.md §6): this agent currently generates
# in code and does NOT yet read this cookbook. Wiring GENERATE to be
# cookbook-first (LLM only as a fallback) is the task that closes that gap.

sonar_strategies:
  # The .NET scanner is a global tool that wraps a build and runs on a JVM.
  dotnet:
    - name: "Sonar: set up JDK"
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
    - name: "Sonar: install scanner"
      run: dotnet tool install --global dotnet-sonarscanner
    - name: Sonar scan begin
      run: >-
        dotnet-sonarscanner begin /k:"__SONAR_PROJECT_KEY__" /o:"__SONAR_ORG__"
        /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$SONAR_TOKEN"
        /d:sonar.qualitygate.wait=false
        /d:sonar.exclusions="**/.github/**,**/Program.cs"
        /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
    - name: Sonar build
      run: dotnet build --configuration Release
    - name: Sonar scan end
      run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

cookbooks:
  dotnet:
    language: csharp
    display_name: .NET (C#)
    setup:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
    build:
      - dotnet restore
      - dotnet build --configuration Release --no-restore
    # Collect coverage in OpenCover format (coverlet.collector, via a runsettings)
    # so the Sonar .NET scanner can read it from sonar.cs.opencover.reportsPaths.
    test: |
      cat > coverlet.runsettings <<'EOF'
      <RunSettings><DataCollectionRunSettings><DataCollectors><DataCollector friendlyName="XPlat Code Coverage"><Configuration><Format>opencover</Format></Configuration></DataCollector></DataCollectors></DataCollectionRunSettings></RunSettings>
      EOF
      dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults
    sonar: dotnet
    dockerfile: |
      FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
      WORKDIR /src
      COPY . .
      RUN dotnet publish -c Release -o /app

      FROM mcr.microsoft.com/dotnet/aspnet:8.0
      WORKDIR /app
      COPY --from=build /app .
      EXPOSE 8080
      # TODO: set to your published entrypoint dll, e.g. MyApp.dll
      ENTRYPOINT ["dotnet", "app.dll"]
